<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Spiraled — H4 Trade Scanner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap');
:root{--cream:#F4EFE6;--paper:#FBF8F2;--ink:#2E2A24;--terra:#B5654A;--terra2:#9A4F38;--line:#DCD3C2;--muted:#8C8475;--no:#B5654A;--yes:#5F7A52;}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Jost',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;}
h1{font-family:'Cormorant Garamond',serif;}
.wrap{max-width:880px;margin:0 auto;padding:36px 22px 80px;}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
header h1{font-size:34px;font-weight:600;margin:0;}
header .tag{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.lede{color:var(--muted);font-size:14px;margin:2px 0 28px;line-height:1.6;}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:20px 22px;margin-bottom:18px;}
.panel-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:8px;}
.panel-title::after{content:"";flex:1;height:1px;background:var(--line);}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;}
input[type=text],input[type=password],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:2px;background:#fff;font-family:'Jost',sans-serif;font-size:14px;color:var(--ink);}
input:focus{outline:1px solid var(--terra);}
.row{display:flex;gap:14px;flex-wrap:wrap;}.row>div{flex:1;min-width:140px;}
button{font-family:'Jost',sans-serif;font-weight:500;font-size:13px;letter-spacing:.04em;background:var(--ink);color:var(--paper);border:none;border-radius:2px;padding:11px 20px;cursor:pointer;transition:opacity .15s;}
button:hover{opacity:.85;}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}button:disabled{opacity:.4;cursor:not-allowed;}
.keyrow{display:flex;gap:10px;align-items:flex-end;}.keyrow>div{flex:1;}
.status-line{font-size:12px;color:var(--muted);margin-top:8px;}.status-line.ok{color:var(--yes);}.status-line.err{color:var(--no);}
.scan-btn{margin-top:18px;width:100%;padding:14px;font-size:14px;}
.checklist{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.checklist label{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--ink);cursor:pointer;}
.checklist input[type=checkbox]{width:16px;height:16px;margin-top:2px;accent-color:var(--terra);}
.helper-link{color:var(--terra2);text-decoration:underline;}
.cards{display:flex;flex-direction:column;gap:16px;margin-top:8px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:2px;overflow:hidden;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);}
.card-head .pair{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;}
.verdict{font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:20px;font-weight:500;}
.verdict.yes{background:rgba(95,122,82,.14);color:var(--yes);}.verdict.no{background:rgba(181,101,74,.13);color:var(--no);}.verdict.setup{background:rgba(180,140,60,.13);color:#8a6a20;}.verdict.pending{background:rgba(140,132,117,.13);color:var(--muted);}
.card-body{padding:18px 20px;}
.steps{display:flex;flex-direction:column;gap:8px;}
.step{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;}
.step .mark{width:16px;flex-shrink:0;margin-top:1px;}.step.pass .mark{color:var(--yes);}.step.fail .mark{color:var(--no);}.step.info .mark{color:#8a6a20;}
.step .detail{color:var(--muted);}
.trade-summary{background:rgba(181,101,74,.06);border:1px solid rgba(181,101,74,.25);border-radius:2px;padding:14px 16px;margin-top:14px;}
.setup-alert{background:rgba(180,140,60,.07);border:1px solid rgba(180,140,60,.3);border-radius:2px;padding:12px 16px;margin-top:14px;font-size:13px;color:#7a5c10;line-height:1.5;}
.trade-summary .row2{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;flex-wrap:wrap;gap:4px;}
.trade-summary .row2 .k{color:var(--muted);}.trade-summary .row2 .v{font-weight:500;}
.manual-block{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
.err-box{padding:14px 20px;color:var(--no);font-size:13px;}
.loading{padding:30px;text-align:center;color:var(--muted);font-size:13px;}
footer{margin-top:30px;font-size:11.5px;color:var(--muted);line-height:1.6;text-align:center;}
</style>

<body>
<div class="wrap">
  <header><h1>Spiraled</h1><div class="tag">H4 Trade Scanner</div></header>
  <p class="lede">Tori Trades A+ — sequential setup detection. Shows both "setup forming" (compression) and "break confirmed" states separately.</p>

  <div class="panel">
    <div class="panel-title">Data source</div>
    <div class="keyrow">
      <div><label for="apiKey">Twelve Data API key</label>
      <input type="password" id="apiKey" placeholder="free key from twelvedata.com"></div>
      <button class="secondary" id="saveKeyBtn">Save key</button>
    </div>
    <div class="status-line" id="keyStatus">Key stored only in this browser.</div>
    <div class="row" style="margin-top:16px;">
      <div><label for="accountSize">Account size (optional)</label><input type="number" id="accountSize" placeholder="e.g. 10000"></div>
      <div><label for="riskPct">Risk % (0.25–0.5)</label><input type="number" id="riskPct" value="0.5" step="0.05"></div>
    </div>
    <button class="scan-btn" id="scanBtn">Scan all pairs</button>
    <div class="status-line" id="scanStatus"></div>
  </div>

  <div id="results" class="cards"></div>
  <footer>Heuristic scanner — not financial advice. Always verify visually and check news before entering.</footer>
</div>

<script>
const PAIRS=["EUR/USD","GBP/USD","USD/JPY","EUR/JPY","GBP/JPY"];
const apiKeyInput=document.getElementById('apiKey');
const keyStatus=document.getElementById('keyStatus');
const resultsEl=document.getElementById('results');
const scanStatus=document.getElementById('scanStatus');
const scanBtn=document.getElementById('scanBtn');

function loadKey(){try{const v=localStorage.getItem('td_key');if(v){apiKeyInput.value=v;keyStatus.textContent='Saved key loaded.';keyStatus.className='status-line ok';}}catch(e){}}
document.getElementById('saveKeyBtn').addEventListener('click',()=>{
  const v=apiKeyInput.value.trim();
  if(!v){keyStatus.textContent='Enter a key first.';keyStatus.className='status-line err';return;}
  try{localStorage.setItem('td_key',v);keyStatus.textContent='Key saved.';keyStatus.className='status-line ok';}
  catch(e){keyStatus.textContent='Could not save (private mode?). Usable this session.';keyStatus.className='status-line err';}
});
loadKey();

async function fetchCandles(symbol,apiKey){
  const url='https://api.twelvedata.com/time_series?symbol='+encodeURIComponent(symbol)+'&interval=4h&outputsize=200&apikey='+apiKey;
  const res=await fetch(url);const data=await res.json();
  if(data.status==='error'||!data.values)throw new Error(data.message||'No data returned');
  return data.values.map(v=>({t:new Date(v.datetime).getTime(),o:parseFloat(v.open),h:parseFloat(v.high),l:parseFloat(v.low),c:parseFloat(v.close)})).reverse();
}

// ── Shared core logic — Tori Trades A+ (sequential compression → break) ──────

function calcATR(candles, period) {
  const trs=[];
  for(let i=1;i<candles.length;i++){
    const c=candles[i],p=candles[i-1];
    trs.push(Math.max(c.h-c.l,Math.abs(c.h-p.c),Math.abs(c.l-p.c)));
  }
  const out=[];
  for(let i=0;i<trs.length;i++){
    const sl=trs.slice(Math.max(0,i-period+1),i+1);
    out.push(sl.reduce((a,b)=>a+b,0)/sl.length);
  }
  return out;
}

function findPivots(candles, lookback=3) {
  const highs=[],lows=[];
  for(let i=lookback;i<candles.length-lookback;i++){
    const w=candles.slice(i-lookback,i+lookback+1),c=candles[i];
    if(c.h===Math.max(...w.map(x=>x.h)))highs.push({i,price:c.h});
    if(c.l===Math.min(...w.map(x=>x.l)))lows.push({i,price:c.l});
  }
  return{highs,lows};
}

function linReg(pts) {
  const n=pts.length,sx=pts.reduce((a,p)=>a+p.i,0),sy=pts.reduce((a,p)=>a+p.price,0);
  const sxy=pts.reduce((a,p)=>a+p.i*p.price,0),sxx=pts.reduce((a,p)=>a+p.i*p.i,0);
  const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx||1);
  return{slope,intercept:(sy-slope*sx)/n};
}

function findValidTaps(pts, minSpacing=4, minTaps=2, maxTaps=3) {
  const taps=[];
  for(let i=pts.length-1;i>=0;i--){
    if(taps.length===0){taps.unshift(pts[i]);}
    else if(taps[0].i-pts[i].i>=minSpacing){taps.unshift(pts[i]);}
    if(taps.length>=maxTaps)break;
  }
  return taps.length>=minTaps?taps:null;
}

function slopeOk(slope, atr) {
  const a=Math.abs(slope);
  return a>atr*0.02 && a<atr*0.6;
}

function countPriorBreaks(candles, tl, trend) {
  let breaks=0,wasBelow=false,init=false;
  const from=Math.max(0,candles.length-80);
  for(let i=from;i<candles.length-1;i++){
    const lv=tl.slope*i+tl.intercept;
    const beyond=trend==='up'?candles[i].c>lv:candles[i].c<lv;
    if(!init){wasBelow=!beyond;init=true;continue;}
    if(beyond&&wasBelow){breaks++;wasBelow=false;}
    else if(!beyond){wasBelow=true;}
  }
  return breaks;
}

function detectSweep(candles, highs, lows, trend) {
  if(trend==='up'&&lows.length>=2){
    const pr=lows[lows.length-2];
    return candles.slice(Math.max(0,pr.i+1),pr.i+10).some(c=>c.l<pr.price&&c.c>pr.price);
  }
  if(trend==='down'&&highs.length>=2){
    const pr=highs[highs.length-2];
    return candles.slice(Math.max(0,pr.i+1),pr.i+10).some(c=>c.h>pr.price&&c.c<pr.price);
  }
  return false;
}

// Build trendline context — used by both compression check and break check
function buildTrendlineContext(candles, atrSeries) {
  if(candles.length<60) return null;
  const lastATR=atrSeries[atrSeries.length-1];
  const{highs,lows}=findPivots(candles,3);
  const H4W=30;

  // Step 1: trend
  let trend=null;
  if(highs.length>=2&&lows.length>=2){
    const h1=highs[highs.length-2],h2=highs[highs.length-1];
    const l1=lows[lows.length-2],l2=lows[lows.length-1];
    if(h2.price>h1.price&&l2.price>l1.price) trend='up';
    else if(h2.price<h1.price&&l2.price<l1.price) trend='down';
  }
  if(!trend) return null;

  // Step 2: trendline
  const pool=trend==='up'?lows:highs;
  const taps=findValidTaps(pool,4,2,3);
  if(!taps) return null;
  const span=taps[taps.length-1].i-taps[0].i;
  if(span<H4W) return null;
  const trendline=linReg(taps);
  if(!slopeOk(Math.abs(trendline.slope),lastATR)) return null;
  const priorBreaks=countPriorBreaks(candles,trendline,trend);
  if(priorBreaks>1) return null;

  return{trend,trendline,taps,span,priorBreaks,highs,lows,lastATR,H4W};
}

// PHASE A: compression — price approaching the line, setup forming
// Returns context if setup is forming (no break yet required)
function detectCompression(candles, atrSeries) {
  const ctx=buildTrendlineContext(candles,atrSeries);
  if(!ctx) return null;
  const{trend,trendline,lastATR}=ctx;
  const li=candles.length-1;
  const lv=trendline.slope*li+trendline.intercept;
  const dist=Math.abs(candles[li].c-lv);
  // Price must be within 2×ATR of line and on the correct side (not yet broken)
  const onCorrectSide=trend==='up'?candles[li].c<lv:candles[li].c>lv;
  if(!onCorrectSide) return null; // already broken — handle in phase B
  if(dist>lastATR*2) return null;
  return{...ctx,dist,compressionATRs:(dist/lastATR).toFixed(2)};
}

// PHASE B: break — a recent candle (within last 3) closed beyond the line with body dominance
// This separates compression phase from break phase
function detectBreak(candles, atrSeries) {
  const ctx=buildTrendlineContext(candles,atrSeries);
  if(!ctx) return null;
  const{trend,trendline,highs,lows,lastATR,taps,span,priorBreaks,H4W}=ctx;

  // Look back up to 3 candles for the break candle
  let breakCandle=null,breakIdx=null;
  for(let offset=0;offset<=3;offset++){
    const idx=candles.length-1-offset;
    if(idx<0) break;
    const lv=trendline.slope*idx+trendline.intercept;
    const c=candles[idx];
    const body=Math.abs(c.c-c.o),range=c.h-c.l||1e-9;
    const bodyRatio=body/range;
    const beyond=trend==='up'?c.c>lv:c.c<lv;
    if(beyond&&bodyRatio>0.55){
      // Also check the candle BEFORE was on the correct side (confirms it's a fresh break)
      if(idx>0){
        const prevLv=trendline.slope*(idx-1)+trendline.intercept;
        const prevOnSide=trend==='up'?candles[idx-1].c<prevLv:candles[idx-1].c>prevLv;
        if(prevOnSide){breakCandle=c;breakIdx=idx;break;}
      }
    }
  }
  if(!breakCandle) return null;

  // Compute stop & target from break candle
  const entry=breakCandle.c;
  const li=breakIdx;
  const tlv=trendline.slope*li+trendline.intercept;
  const oppPool=trend==='up'?highs:lows;
  const oppTaps=findValidTaps(oppPool,4,2,3)||oppPool.slice(-2);
  const safetyLine=oppTaps&&oppTaps.length>=2?linReg(oppTaps):null;

  let stop,stopNote;
  if(safetyLine){
    const sv=safetyLine.slope*(li+4)+safetyLine.intercept;
    const valid=trend==='up'?sv<entry:sv>entry;
    stop=valid?sv:(trend==='up'?tlv-lastATR*0.5:tlv+lastATR*0.5);
    stopNote=valid?'Safety line (opposing trendline) at 4th candle':'ATR fallback';
  }else{
    stop=trend==='up'?tlv-lastATR*0.5:tlv+lastATR*0.5;
    stopNote='ATR-based stop beyond trendline';
  }

  const riskDist=Math.abs(entry-stop);
  if(riskDist===0) return null;

  let target;
  if(trend==='up'){const fh=highs.filter(h=>h.price>entry);target=fh.length?Math.min(...fh.map(h=>h.price)):entry+riskDist*2.5;}
  else{const fl=lows.filter(l=>l.price<entry);target=fl.length?Math.max(...fl.map(l=>l.price)):entry-riskDist*2.5;}

  const rMultiple=Math.abs(target-entry)/riskDist;
  if(rMultiple<2) return null;

  const sweep=detectSweep(candles,highs,lows,trend);
  const bodyRatio=(Math.abs(breakCandle.c-breakCandle.o)/(breakCandle.h-breakCandle.l||1e-9)*100).toFixed(0);

  return{
    trend,direction:trend==='up'?'Long':'Short',
    entry,stop,target,rMultiple,riskDist,
    taps:taps.length,spanWeeks:(span/H4W).toFixed(1),
    priorBreaks,bodyRatio,sweep,stopNote,
    candlesSinceBreak:candles.length-1-breakIdx
  };
}

function fmt(sym,v){if(v==null)return'—';return v.toFixed(sym.includes('JPY')?3:5);}

function renderCard(symbol,breakSig,compSig,accountSize,riskPct){
  const card=document.createElement('div');card.className='card';

  let vc,vt,bodyHtml='';

  if(breakSig){
    // Full A+ signal — break confirmed
    vc='yes';vt='✅ Break confirmed';
    const t=breakSig;
    const timing=t.candlesSinceBreak===0?'🔴 Just happened this candle':'🟡 '+t.candlesSinceBreak+' candle(s) ago — watch for retest';
    let pos='';
    if(accountSize&&riskPct){
      const ra=accountSize*(riskPct/100);
      const pip=symbol.includes('JPY')?0.01:0.0001;
      const spips=Math.abs(t.entry-t.stop)/pip;
      const ppv=symbol.includes('JPY')?9.1:10;
      const units=spips>0?ra/(spips*(ppv/100000)):0;
      pos='<div class="row2"><span class="k">Risk amount</span><span class="v">'+ra.toFixed(2)+'</span></div>'+
          '<div class="row2"><span class="k">Stop distance</span><span class="v">'+spips.toFixed(0)+' pips</span></div>'+
          '<div class="row2"><span class="k">Position size (approx)</span><span class="v">'+Math.round(units).toLocaleString()+' units</span></div>';
    }
    bodyHtml='<div class="steps">'+
      '<div class="step pass"><span class="mark">✓</span><span><strong>Trend.</strong> <span class="detail">'+( t.direction==='Long'?'Uptrend (HH/HL)':'Downtrend (LH/LL)')+' confirmed.</span></span></div>'+
      '<div class="step pass"><span class="mark">✓</span><span><strong>Trendline.</strong> <span class="detail">'+t.taps+'-tap line, ≈'+t.spanWeeks+' weeks'+(t.priorBreaks===1?', 1 prior break (allowed)':'')+', moderate slope.</span></span></div>'+
      '<div class="step pass"><span class="mark">✓</span><span><strong>Break confirmation.</strong> <span class="detail">Body-dominant close ('+t.bodyRatio+'%) beyond trendline. '+timing+'</span></span></div>'+
      '<div class="step pass"><span class="mark">✓</span><span><strong>R:R.</strong> <span class="detail">≈'+t.rMultiple.toFixed(1)+'R to next structure.</span></span></div>'+
      '<div class="step '+(t.sweep?'pass':'info')+'"><span class="mark">'+(t.sweep?'✓':'→')+'</span><span><strong>Liquidity sweep.</strong> <span class="detail">'+(t.sweep?'Detected before this move.':'Not detected algorithmically — verify manually on chart.')+'</span></span></div>'+
      '</div>'+
      '<div class="trade-summary">'+
      '<div class="row2"><span class="k">Direction</span><span class="v">'+t.direction+'</span></div>'+
      '<div class="row2"><span class="k">Setup</span><span class="v">'+t.taps+'-tap trendline break</span></div>'+
      '<div class="row2"><span class="k">Entry logic</span><span class="v">'+( t.candlesSinceBreak===0?'Continuation at close':'Retest preferred — break was '+t.candlesSinceBreak+' candle(s) ago')+'</span></div>'+
      '<div class="row2"><span class="k">Stop basis</span><span class="v">'+t.stopNote+'</span></div>'+
      '<div class="row2"><span class="k">Entry (approx)</span><span class="v">'+fmt(symbol,t.entry)+'</span></div>'+
      '<div class="row2"><span class="k">Stop</span><span class="v">'+fmt(symbol,t.stop)+'</span></div>'+
      '<div class="row2"><span class="k">Target</span><span class="v">'+fmt(symbol,t.target)+'</span></div>'+
      '<div class="row2"><span class="k">R potential</span><span class="v">'+t.rMultiple.toFixed(1)+'R</span></div>'+
      pos+'</div>'+
      '<div class="manual-block"><div class="panel-title">Your judgment calls</div>'+
      '<div class="checklist">'+
      '<label><input type="checkbox"> No high-impact news for '+symbol+' in next 1–2h (<a class="helper-link" href="https://www.forexfactory.com/calendar" target="_blank">ForexFactory</a>)</label>'+
      '<label><input type="checkbox"> Pullbacks on the chart looked controlled</label>'+
      '<label><input type="checkbox"> Setup is obvious — not forced or zoomed in</label>'+
      '<label><input type="checkbox"> Price swept liquidity before this move</label>'+
      '<label><input type="checkbox"> Not late Friday with stop far from price</label>'+
      '</div></div>';
  } else if(compSig){
    // Setup forming — compression detected, no break yet
    vc='setup';vt='⏳ Setup forming';
    bodyHtml='<div class="steps">'+
      '<div class="step pass"><span class="mark">✓</span><span><strong>Trend.</strong> <span class="detail">'+(compSig.direction==='Long'?'Uptrend (HH/HL)':'Downtrend (LH/LL)')+' confirmed.</span></span></div>'+
      '<div class="step pass"><span class="mark">✓</span><span><strong>Trendline.</strong> <span class="detail">'+compSig.taps+'-tap line, ≈'+compSig.spanWeeks+' weeks'+(compSig.priorBreaks===1?', 1 prior break (allowed)':'')+', moderate slope.</span></span></div>'+
      '<div class="step info"><span class="mark">→</span><span><strong>Compression.</strong> <span class="detail">Price within '+compSig.compressionATRs+'×ATR of the trendline — approaching the line. Waiting for break.</span></span></div>'+
      '<div class="step fail"><span class="mark">✕</span><span><strong>Break confirmation.</strong> <span class="detail">No body-dominant close beyond trendline yet — watch this pair.</span></span></div>'+
      '</div>'+
      '<div class="setup-alert">👀 Keep this pair on your watchlist. Price is compressing into the '+(compSig.trend==='up'?'support':'resistance')+' trendline. Wait for a strong H4 body close beyond it before considering an entry.</div>';
  } else {
    vc='no';vt='❌ No trade';
    bodyHtml='<div class="steps"><div class="step fail"><span class="mark">✕</span><span><strong>No valid setup.</strong> <span class="detail">Trend, trendline, or structure conditions not met on H4.</span></span></div></div>';
  }

  card.innerHTML='<div class="card-head"><span class="pair">'+symbol+'</span><span class="verdict '+vc+'">'+vt+'</span></div><div class="card-body">'+bodyHtml+'</div>';
  return card;
}

scanBtn.addEventListener('click',async()=>{
  const apiKey=apiKeyInput.value.trim();
  if(!apiKey){scanStatus.textContent='Add your Twelve Data API key first.';scanStatus.className='status-line err';return;}
  const accountSize=parseFloat(document.getElementById('accountSize').value)||null;
  const riskPct=parseFloat(document.getElementById('riskPct').value)||null;
  scanBtn.disabled=true;
  resultsEl.innerHTML='<div class="loading">Pulling H4 candles — checking setup and break phases…</div>';
  scanStatus.textContent='';
  const cards=[];
  for(const symbol of PAIRS){
    try{
      const candles=await fetchCandles(symbol,apiKey);
      const atrSeries=calcATR(candles,14);
      const breakSig=detectBreak(candles,atrSeries);
      const compSig=!breakSig?detectCompression(candles,atrSeries):null;
      cards.push(renderCard(symbol,breakSig,compSig,accountSize,riskPct));
    }catch(e){
      const ec=document.createElement('div');ec.className='card';
      ec.innerHTML='<div class="card-head"><span class="pair">'+symbol+'</span><span class="verdict pending">⚠ error</span></div><div class="err-box">'+e.message+'</div>';
      cards.push(ec);
    }
    await new Promise(r=>setTimeout(r,900));
  }
  resultsEl.innerHTML='';cards.forEach(c=>resultsEl.appendChild(c));
  scanBtn.disabled=false;
  scanStatus.textContent='Scan complete — '+new Date().toLocaleString();
  scanStatus.className='status-line ok';
});
</script>
</body>
</html>
